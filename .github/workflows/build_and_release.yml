name: Build & Release ZeroTrace Desktop

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe & .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Dependencies
        run: npm install

      - name: Download Windows Core Binaries (Wintun & Xray)
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          
          # 1. Fetch Wintun DLL
          curl -L -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          unzip -q -o wintun.zip "wintun/bin/amd64/wintun.dll" -d .
          cp wintun/bin/amd64/wintun.dll src-tauri/binaries/
          rm -rf wintun wintun.zip
          
          # 2. Fetch Xray Windows 64-bit Core
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-windows-64.zip
          unzip -q -o xray.zip xray.exe -d src-tauri/binaries/
          rm -f xray.zip

      - name: Sync App Version from Tag
        shell: bash
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"
          if [ -z "$RAW_VER" ] || [ "$RAW_VER" = "main" ]; then
            RAW_VER="${{ github.event.inputs.release_tag }}"
            RAW_VER="${RAW_VER#v}"
          fi
          if [ -n "$RAW_VER" ] && [ "$RAW_VER" != "main" ]; then
            echo "Synchronizing version $RAW_VER across package.json, tauri.conf.json, and Cargo.toml"
            node -e "
              const fs = require('fs');
              const ver = '$RAW_VER';
              
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = ver;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
              
              const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
              tauri.version = ver;
              fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2));

              let updater = fs.readFileSync('src/utils/updater.ts', 'utf8');
              updater = updater.replace(/CURRENT_APP_VERSION = '.*'/, 'CURRENT_APP_VERSION = \'' + ver + '\'');
              fs.writeFileSync('src/utils/updater.ts', updater);
            "
          fi

      - name: Build Tauri Windows
        run: npx tauri build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTrace-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Generate Formatted Release Notes
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('version.json', 'utf8'));
            let notes = '### 🚀 What\'s New in v' + v.version + '\n\n';
            (v.changelog || []).forEach(c => { notes += '* ' + c + '\n'; });
            notes += '\n### 📦 Downloads\n* **macOS (Apple Silicon):** \`ZeroTrace_' + v.version + '_aarch64.dmg\`\n* **Windows (x64):** \`ZeroTrace_' + v.version + '_x64-setup.exe\`\n';
            fs.writeFileSync('RELEASE_NOTES.md', notes);
          "

      - name: Publish Windows Release Asset
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ZeroTrace Desktop ${{ github.ref_name != 'main' && github.ref_name || github.event.inputs.release_tag || 'v1.0.0' }}
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || github.event.inputs.release_tag || 'v1.0.0' }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Dependencies
        run: npm install

      - name: Download macOS Core Binaries (Xray)
        run: |
          mkdir -p src-tauri/binaries
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-macos-arm64-v8a.zip
          unzip -q -o xray.zip xray -d src-tauri/binaries/
          chmod +x src-tauri/binaries/xray
          rm -f xray.zip

      - name: Sync App Version from Tag
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"
          if [ -z "$RAW_VER" ] || [ "$RAW_VER" = "main" ]; then
            RAW_VER="${{ github.event.inputs.release_tag }}"
            RAW_VER="${RAW_VER#v}"
          fi
          if [ -n "$RAW_VER" ] && [ "$RAW_VER" != "main" ]; then
            echo "Synchronizing version $RAW_VER across package.json, tauri.conf.json, and Cargo.toml"
            node -e "
              const fs = require('fs');
              const ver = '$RAW_VER';
              
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = ver;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
              
              const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
              tauri.version = ver;
              fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2));

              let updater = fs.readFileSync('src/utils/updater.ts', 'utf8');
              updater = updater.replace(/CURRENT_APP_VERSION = '.*'/, 'CURRENT_APP_VERSION = \'' + ver + '\'');
              fs.writeFileSync('src/utils/updater.ts', updater);
            "
          fi

      - name: Build Tauri macOS
        run: npx tauri build

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTrace-macOS-arm64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Generate Formatted Release Notes
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const v = JSON.parse(fs.readFileSync('version.json', 'utf8'));
            let notes = '### 🚀 What\'s New in v' + v.version + '\n\n';
            (v.changelog || []).forEach(c => { notes += '* ' + c + '\n'; });
            notes += '\n### 📦 Downloads\n* **macOS (Apple Silicon):** \`ZeroTrace_' + v.version + '_aarch64.dmg\`\n* **Windows (x64):** \`ZeroTrace_' + v.version + '_x64-setup.exe\`\n';
            fs.writeFileSync('RELEASE_NOTES.md', notes);
          "

      - name: Publish macOS Release Asset
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ZeroTrace Desktop ${{ github.ref_name != 'main' && github.ref_name || github.event.inputs.release_tag || 'v1.0.0' }}
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || github.event.inputs.release_tag || 'v1.0.0' }}
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
