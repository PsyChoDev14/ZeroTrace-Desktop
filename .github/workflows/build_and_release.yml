name: Build & Release ZeroTrace Desktop

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (.exe & .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Dependencies
        run: npm install

      - name: Download Windows Core Binaries (Wintun & Xray)
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          
          # 1. Fetch Wintun DLL
          curl -L -o wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          unzip -q -o wintun.zip "wintun/bin/amd64/wintun.dll" -d .
          cp wintun/bin/amd64/wintun.dll src-tauri/binaries/
          rm -rf wintun wintun.zip
          
          # 2. Fetch Xray Windows 64-bit Core
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-windows-64.zip
          unzip -q -o xray.zip xray.exe -d src-tauri/binaries/
          rm -f xray.zip

      - name: Build Tauri Windows
        run: npx tauri build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTrace-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish Windows Release Asset
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || github.event.inputs.release_tag || 'v1.0.0' }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Dependencies
        run: npm install

      - name: Download macOS Core Binaries (Xray)
        run: |
          mkdir -p src-tauri/binaries
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-macos-arm64-v8a.zip
          unzip -q -o xray.zip xray -d src-tauri/binaries/
          chmod +x src-tauri/binaries/xray
          rm -f xray.zip

      - name: Build Tauri macOS
        run: npx tauri build

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTrace-macOS-arm64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg

      - name: Publish macOS Release Asset
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || github.event.inputs.release_tag || 'v1.0.0' }}
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
